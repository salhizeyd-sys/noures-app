<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نورس الأفراح — بوابة الإدارة</title>
  
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- شاشة تسجيل الدخول -->
  <div class="auth-container" id="auth-screen">
    <div class="auth-card">
      <div class="brand-mark">ن</div>
      <h2>نورس الأفراح</h2>
      <p>تسجيل الدخول إلى بوابة الإدارة</p>
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="login-email" placeholder="example@noures.com">
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="login-password" placeholder="••••••••">
      </div>
      <button class="primary-btn" style="width: 100%; margin-top: 10px;" onclick="handleLogin()">تسجيل الدخول</button>
    </div>
  </div>

  <!-- الواجهة الرئيسية -->
  <div class="shell" id="app-shell">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">ن</div>
        <div class="brand-text">
          <div class="display">نورس الأفراح</div>
          <div class="sub">بوابة إدارة الحجوزات والتسليم</div>
        </div>
      </div>
      <div class="user-badge">
        <span id="user-role-display" class="role-tag">—</span>
        <button class="ghost-btn" style="padding: 4px 10px; font-size: 12px;" onclick="handleLogout()">خروج</button>
      </div>
    </div>

    <div class="body-row">
      <div class="sidebar" id="sidebar"></div>
      <main id="main"></main>
    </div>
  </div>

  <!-- Modal & Toast -->
  <div class="overlay" id="overlay">
    <div class="modal" id="modal-content"></div>
  </div>
  <div class="toast" id="toast"></div>

  <!-- JavaScript Files -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
